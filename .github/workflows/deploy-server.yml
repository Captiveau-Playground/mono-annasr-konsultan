# Deploy otomatis ke VPS setelah image dipublish ke GHCR.
#
# Trigger:
#   - otomatis setelah workflow docker-publish.yml sukses (push main / tag)
#   - manual (workflow_dispatch)
#
# Di server: pull image GHCR + `docker compose up -d --pull always`.
#
# Secrets yang harus diset di GitHub (Settings → Secrets → Actions):
#   SSH_HOST      — IP/domain VPS
#   SSH_USER      — user SSH (mis. root/deployer)
#   SSH_KEY       — private key SSH (PEM) utk user di atas
#   SSH_PORT      — [opsional] default 22
#   GHCR_USER     — username GitHub (utk docker login, bila image private)
#   GHCR_TOKEN    — PAT scope read:packages (bila image private)
#
# Bila image di GHCR dibuat PUBLIC, cukup SSH_HOST/USER/KEY (login tidak perlu).

name: Deploy to VPS

on:
  # Manual — untuk tes SSH / deploy tanpa build ulang (pakai image latest).
  workflow_dispatch:
  # Otomatis setelah docker-publish sukses (mis. push tag v*).
  workflow_run:
    workflows: ["Build & Push Docker images (GHCR)"]
    types: [completed]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Periksa secrets SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "::error::Secret SSH_HOST belum diset (Settings → Secrets → Actions)"; exit 1; }
          test -n "$USER" || { echo "::error::Secret SSH_USER belum diset"; exit 1; }
          test -n "$KEY" || { echo "::error::Secret SSH_KEY belum diset"; exit 1; }
          echo "OK: host=$HOST user=$USER key-len=${#KEY}"

      - name: Deploy via SSH (ssh polos)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_DIR: /opt/mono-annasr-konsultan/deploy
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          # Tulis private key & konek langsung via ssh (tanpa action pihak ketiga)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_app
          chmod 600 ~/.ssh/id_app

          export TARGET="$SSH_USER@$SSH_HOST"

          # Command jarak jauh — jalankan kalau folder deploy tersedia.
          REMOTE=$(cat <<'RMT'
          set -e
          cd "$DEPLOY_DIR" || { echo "FOLDER TIDAK ADA: $DEPLOY_DIR"; ls -la /opt; exit 1; }
          if [ ! -f docker-compose.yml ]; then
            echo "GAGAL: docker-compose.yml belum ada di $DEPLOY_DIR"
            ls -la
            exit 1
          fi
          if [ -n "$GHCR_USER" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          docker compose pull ui strapi
          docker compose up -d --remove-orphans
          docker image prune -f
          RMT
          )

          # Kirim env GHCR ke remote secara eksplisit (tanpa heredoc env leak).
          REMOTE="export DEPLOY_DIR='$DEPLOY_DIR'; export GHCR_USER='$GHCR_USER'; export GHCR_TOKEN='$GHCR_TOKEN'; $REMOTE"

          ssh -i ~/.ssh/id_app \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -p "$SSH_PORT" "$TARGET" "bash -s" <<EOF
          $REMOTE
          EOF